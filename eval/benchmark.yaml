  # ------------------------------------------------------------------ hard
  - id: q27
    question: "Did Germany generate more revenue than France in 2011, and by how
               much in pounds?"
    difficulty: hard
    answerable: true
    gt_value: 13445.60
    required_columns: [difference]  # The question asks for the difference in pounds.
    also_accept: [6.72]             # the same gap as a percentage
    gt_answer: "Yes - Germany GBP 213,472.66 against France GBP 200,027.06, a
                difference of GBP 13,445.60 (6.72%)."
    gt_sql: |
      WITH c AS (
        SELECT country, SUM(revenue) AS revenue
        FROM sales
        WHERE NOT is_cancellation AND country IN ('Germany', 'France')
          AND year(invoice_date) = 2011
        GROUP BY country
      )
      SELECT ROUND(MAX(CASE WHEN country = 'Germany' THEN revenue END), 2) AS germany,
             ROUND(MAX(CASE WHEN country = 'France'  THEN revenue END), 2) AS france,
             ROUND(MAX(CASE WHEN country = 'Germany' THEN revenue END)
                 - MAX(CASE WHEN country = 'France'  THEN revenue END), 2) AS difference,
             ROUND(100.0 * (MAX(CASE WHEN country = 'Germany' THEN revenue END)
                          - MAX(CASE WHEN country = 'France'  THEN revenue END))
                   / MAX(CASE WHEN country = 'France' THEN revenue END), 2) AS pct
      FROM c;
    expected_tool: run_python
    expected_chart: bar
    kpi: revenue_by_country
    notes: "Two queried numbers then a subtraction - tests the recompute check."
    reviewed_by: null


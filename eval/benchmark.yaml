    gt_sql: null
    expected_tool: none
    expected_chart: none
    reviewed_by: null

  - id: q14
    question: "How did December 2011 compare with November 2011?"
    difficulty: trick
    answerable: false
    gt_value: null
    gt_answer: "Refuse the direct comparison. December 2011 has only 8 trading days
                (data stops 9 Dec) versus 26 in November, so it is not a complete
                month. The agent may report the raw figures (637,808.33 vs
                1,503,866.78) but must flag the comparison as invalid."
    gt_sql: |
      SELECT invoice_month, ROUND(net_revenue, 2) AS revenue,
             trading_days, is_complete_month
      FROM dim_month WHERE invoice_month IN ('2011-11', '2011-12');
    expected_tool: run_sql
    expected_chart: none
    notes: "Partial-refusal test: the data exists but the comparison does not hold.
            This is the most realistic failure mode in the whole benchmark."
    reviewed_by: null

  - id: q15
